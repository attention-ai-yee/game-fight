<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Game Fight 示意图</title>
<!-- 设计文档里的两张示意图（主界面、接力连携）的源文件。用浏览器打开即可看到；
     导出 PNG：node tools/render-mockups.cjs（见 docs/游戏设计文档.md 末尾）。 -->
<style>
  body { margin: 0; background: #f4f1ea; font-family: 'ZCOOL KuaiLe', 'WenQuanYi Zen Hei', 'PingFang SC', sans-serif; }
  svg { display: block; margin: 0 auto 24px; }
  text { font-family: inherit; }
  .stroke { paint-order: stroke; stroke-linejoin: round; }
</style>
</head>
<body>
<svg id="main" width="900" height="720" viewBox="0 0 900 720"></svg>
<svg id="combo" width="900" height="580" viewBox="0 0 900 580"></svg>
<svg id="horizontal" width="1100" height="720" viewBox="0 0 1100 720"></svg>
<script>
const C = {
  ink: '#2a2440', grass: '#86c86f', grass2: '#6db25c', road: '#ecd6a8', roadEdge: '#c9a874',
  panel: '#2b2f4a', panel2: '#22253b', gold: '#ffc93c', orange: '#ff8a1f', white: '#ffffff',
  purple: '#8f6fd0', green: '#73b86a', red: '#d9534f', blue: '#3f72d9', skin: '#ffdcbc',
};

// ---------- 小部件 ----------
function txt(x, y, s, size, fill, o = {}) {
  const sw = o.sw ?? Math.max(2, size / 6);
  return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${o.anchor || 'middle'}"
    ${o.stroke !== false ? `stroke="${o.strokeColor || C.ink}" stroke-width="${sw}" class="stroke"` : ''}
    ${o.rot ? `transform="rotate(${o.rot} ${x} ${y})"` : ''} ${o.weight ? `font-weight="${o.weight}"` : ''}>${s}</text>`;
}
function flame(x, y, k = 1) {
  return `<g transform="translate(${x} ${y}) scale(${k})">
    <path d="M0,-8 C4,-3 6,1 3,6 C1,8 -1,8 -3,6 C-6,1 -2,-2 0,-8 Z" fill="${C.orange}" stroke="${C.ink}" stroke-width="1.2"/>
    <path d="M0,-2 C2,1 2,4 0,6 C-2,4 -2,1 0,-2 Z" fill="#ffe066"/></g>`;
}
function crack(x, y, k = 1) { // 破甲印记：裂开的盾
  return `<g transform="translate(${x} ${y}) scale(${k})">
    <path d="M-6,-7 L6,-7 L6,0 C6,5 0,8 0,8 C0,8 -6,5 -6,0 Z" fill="#c7cbd6" stroke="${C.ink}" stroke-width="1.2"/>
    <path d="M0,-7 L-2,-2 L2,1 L-1,6" fill="none" stroke="${C.ink}" stroke-width="1.3"/></g>`;
}
function enemy(x, y, s, color, mark, stacks) {
  const r = 15 * s;
  let g = `<ellipse cx="${x}" cy="${y + r * 0.85}" rx="${r * 0.9}" ry="${r * 0.25}" fill="rgba(0,0,0,.18)"/>`;
  g += `<path d="M${x - r * 0.55},${y - r * 0.6} l${-r * 0.2},${-r * 0.55} l${r * 0.45},${r * 0.3} Z M${x + r * 0.55},${y - r * 0.6} l${r * 0.2},${-r * 0.55} l${-r * 0.45},${r * 0.3} Z" fill="#f3e3c3" stroke="${C.ink}" stroke-width="1.5"/>`;
  g += `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 0.88}" fill="${color}" stroke="${C.ink}" stroke-width="2"/>`;
  g += `<ellipse cx="${x - r * 0.3}" cy="${y - r * 0.38}" rx="${r * 0.28}" ry="${r * 0.16}" fill="rgba(255,255,255,.35)"/>`;
  for (const d of [-1, 1]) {
    g += `<circle cx="${x + d * r * 0.36}" cy="${y - r * 0.05}" r="${r * 0.26}" fill="#fff" stroke="${C.ink}" stroke-width="1.2"/>`;
    g += `<circle cx="${x + d * r * 0.33}" cy="${y + r * 0.04}" r="${r * 0.13}" fill="${C.ink}"/>`;
    g += `<line x1="${x + d * r * 0.62}" y1="${y - r * 0.42}" x2="${x + d * r * 0.14}" y2="${y - r * 0.26}" stroke="${C.ink}" stroke-width="${Math.max(1.4, r * 0.12)}" stroke-linecap="round"/>`;
  }
  g += `<path d="M${x - r * 0.25},${y + r * 0.48} q${r * 0.25},${-r * 0.2} ${r * 0.5},0" fill="none" stroke="${C.ink}" stroke-width="1.5" stroke-linecap="round"/>`;
  if (mark) {
    const mx = x + r * 0.95, my = y - r * 1.05;
    g += mark === 'fire' ? flame(mx, my, 0.85 + s * 0.25) : crack(mx, my, 0.85 + s * 0.25);
    if (stacks) g += txt(mx + 8, my + 4, stacks, 9 + 3 * s, '#fff', { sw: 2.5 });
  }
  return g;
}
function hpBar(x, y, w, p, color = '#5fd35f') {
  return `<rect x="${x - w / 2}" y="${y}" width="${w}" height="5" rx="2.5" fill="${C.ink}"/>
          <rect x="${x - w / 2 + 1}" y="${y + 1}" width="${(w - 2) * p}" height="3" rx="1.5" fill="${color}"/>`;
}
function burst(x, y, r, fill = '#ffd23f', stroke = C.orange, n = 10) {
  let p = '';
  for (let i = 0; i < n * 2; i++) {
    const a = (Math.PI * i) / n - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    p += `${i ? 'L' : 'M'}${(x + Math.cos(a) * rr).toFixed(1)},${(y + Math.sin(a) * rr).toFixed(1)}`;
  }
  return `<path d="${p}Z" fill="${fill}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="${x}" cy="${y}" r="${r * 0.3}" fill="#fff"/>`;
}
function fireball(x, y, k = 1) {
  return `<g transform="translate(${x} ${y}) scale(${k})">
    <path d="M-5,0 Q0,26 5,0 Z" fill="${C.orange}" opacity=".55"/>
    <path d="M-3,0 Q0,16 3,0 Z" fill="#ffe066" opacity=".8"/>
    <circle r="6.5" fill="${C.orange}" stroke="#c4501a" stroke-width="1.2"/><circle r="3.2" cy="-1" fill="#fff3b0"/></g>`;
}
function coin(x, y, r) {
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${C.gold}" stroke="#b07a10" stroke-width="1.5"/>
          <circle cx="${x}" cy="${y}" r="${r * 0.55}" fill="none" stroke="#e0a21e" stroke-width="1.2"/>`;
}
function badge(x, y, n) {
  return `<circle cx="${x}" cy="${y}" r="10" fill="#ff4d6d" stroke="#fff" stroke-width="2"/>
          <text x="${x}" y="${y + 4.5}" font-size="13" fill="#fff" text-anchor="middle">${n}</text>`;
}

// 英雄背身（战斗里）
function heroBack(type, x, y, k = 1) {
  let g = `<g transform="translate(${x} ${y}) scale(${k})">`;
  g += `<ellipse cx="0" cy="30" rx="26" ry="7" fill="rgba(0,0,0,.22)"/>`;
  if (type === 'mage') {
    g += `<line x1="18" y1="30" x2="24" y2="-28" stroke="#7a4a26" stroke-width="4" stroke-linecap="round"/>`;
    g += `<circle cx="24" cy="-32" r="10" fill="rgba(255,160,60,.35)"/><circle cx="24" cy="-32" r="6" fill="${C.orange}" stroke="#c4501a" stroke-width="1.5"/>`;
    g += `<path d="M-17,30 L17,30 L10,-6 L-10,-6 Z" fill="${C.blue}" stroke="${C.ink}" stroke-width="2"/>`;
    g += `<path d="M-17,30 L17,30 L15,22 L-15,22 Z" fill="#ffd34d" stroke="${C.ink}" stroke-width="1.5"/>`;
    g += `<circle cx="0" cy="-12" r="11" fill="#7a5634" stroke="${C.ink}" stroke-width="2"/>`;
    g += `<ellipse cx="0" cy="-17" rx="17" ry="5" fill="#5b3fa8" stroke="${C.ink}" stroke-width="2"/>`;
    g += `<path d="M-10,-18 L2,-48 L10,-18 Z" fill="#6b4cc0" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`;
    g += `<circle cx="2" cy="-48" r="3" fill="${C.gold}"/>`;
  } else if (type === 'sword') {
    g += `<path d="M-16,28 Q-24,8 -12,-6 L12,-6 Q24,8 16,28 Z" fill="#b8352f" stroke="${C.ink}" stroke-width="2"/>`;
    g += `<path d="M-10,-6 L10,-6 L13,24 L-13,24 Z" fill="#9aa3b5" stroke="${C.ink}" stroke-width="2"/>`;
    g += `<circle cx="0" cy="-15" r="12" fill="#c3cad8" stroke="${C.ink}" stroke-width="2"/>`;
    g += `<path d="M0,-27 Q14,-36 12,-14" fill="none" stroke="${C.red}" stroke-width="5" stroke-linecap="round"/>`;
    g += `<line x1="16" y1="4" x2="30" y2="-40" stroke="#e8edf5" stroke-width="5" stroke-linecap="round"/>`;
    g += `<line x1="16" y1="4" x2="30" y2="-40" stroke="${C.ink}" stroke-width="1" />`;
    g += `<line x1="10" y1="-2" x2="24" y2="4" stroke="#7a4a26" stroke-width="4" stroke-linecap="round"/>`;
  } else {
    g += `<path d="M-15,30 L15,30 L11,-6 L-11,-6 Z" fill="#3f8f4f" stroke="${C.ink}" stroke-width="2"/>`;
    g += `<rect x="6" y="-14" width="7" height="26" rx="2" fill="#8a5a2b" stroke="${C.ink}" stroke-width="1.5" transform="rotate(18 9 0)"/>`;
    g += `<path d="M8,-16 l2,-8 M12,-15 l3,-7" stroke="${C.ink}" stroke-width="1.5"/>`;
    g += `<path d="M-12,-14 Q0,-34 12,-14 L10,-4 L-10,-4 Z" fill="#4fa35e" stroke="${C.ink}" stroke-width="2"/>`;
    g += `<path d="M-24,-30 Q-34,0 -24,28" fill="none" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/>`;
    g += `<line x1="-24" y1="-30" x2="-24" y2="28" stroke="#eee" stroke-width="1"/>`;
  }
  return g + '</g>';
}
// 英雄头像（英雄栏）
function portrait(type, x, y, r, st = {}) {
  const bg = { sword: '#e0645c', mage: '#5a86e6', archer: '#5fb46c' }[type];
  let g = '';
  if (st.glow) g += `<circle cx="${x}" cy="${y}" r="${r + 9}" fill="rgba(255,210,60,.35)"/><circle cx="${x}" cy="${y}" r="${r + 5}" fill="none" stroke="${C.gold}" stroke-width="3" stroke-dasharray="6 4"/>`;
  g += `<circle cx="${x}" cy="${y}" r="${r}" fill="${bg}" stroke="${st.active ? C.gold : '#141626'}" stroke-width="${st.active ? 4 : 2.5}"/>`;
  g += `<clipPath id="pc${x}${y}"><circle cx="${x}" cy="${y}" r="${r - 2}"/></clipPath><g clip-path="url(#pc${x}${y})">`;
  const fy = y + r * 0.2, fr = r * 0.48;
  if (type === 'archer') g += `<path d="M${x - fr * 1.35},${y + r} Q${x - fr * 1.5},${fy - fr * 1.8} ${x},${fy - fr * 1.75} Q${x + fr * 1.5},${fy - fr * 1.8} ${x + fr * 1.35},${y + r} Z" fill="#3f8f4f"/>`;
  g += `<path d="M${x - r * 0.75},${y + r} Q${x},${y + r * 0.45} ${x + r * 0.75},${y + r} Z" fill="${{ sword: '#9aa3b5', mage: C.blue, archer: '#3f8f4f' }[type]}"/>`;
  g += `<circle cx="${x}" cy="${fy}" r="${fr}" fill="${C.skin}" stroke="${C.ink}" stroke-width="1.5"/>`;
  g += `<circle cx="${x - fr * 0.38}" cy="${fy + fr * 0.05}" r="${fr * 0.12}" fill="${C.ink}"/><circle cx="${x + fr * 0.38}" cy="${fy + fr * 0.05}" r="${fr * 0.12}" fill="${C.ink}"/>`;
  g += `<path d="M${x - fr * 0.2},${fy + fr * 0.42} q${fr * 0.2},${fr * 0.18} ${fr * 0.4},0" fill="none" stroke="${C.ink}" stroke-width="1.3" stroke-linecap="round"/>`;
  if (type === 'mage') g += `<ellipse cx="${x}" cy="${fy - fr * 0.7}" rx="${fr * 1.35}" ry="${fr * 0.32}" fill="#5b3fa8" stroke="${C.ink}" stroke-width="1.5"/><path d="M${x - fr * 0.8},${fy - fr * 0.75} L${x + fr * 0.2},${fy - fr * 2.3} L${x + fr * 0.8},${fy - fr * 0.75} Z" fill="#6b4cc0" stroke="${C.ink}" stroke-width="1.5"/>`;
  if (type === 'sword') g += `<path d="M${x - fr * 1.05},${fy} A${fr * 1.05},${fr * 1.1} 0 0 1 ${x + fr * 1.05},${fy} L${x + fr * 0.8},${fy - fr * 0.25} L${x - fr * 0.8},${fy - fr * 0.25} Z" fill="#c3cad8" stroke="${C.ink}" stroke-width="1.5"/><path d="M${x},${fy - fr * 1.05} q${fr * 0.9},${-fr * 0.6} ${fr * 1.1},${fr * 0.2}" stroke="${C.red}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  g += '</g>';
  if (st.cd) { // 冷却遮罩（扇形）
    const a = st.cd * 2 * Math.PI, ex = x + Math.sin(a) * r, ey = y - Math.cos(a) * r;
    g += `<path d="M${x},${y} L${x},${y - r} A${r},${r} 0 ${st.cd > 0.5 ? 1 : 0} 1 ${ex},${ey} Z" fill="rgba(10,10,25,.62)"/>`;
    g += txt(x, y + 6, st.cdText, 17, '#fff', { sw: 3 });
  }
  if (st.hp != null) g += hpBar(x, y + r + 6, r * 1.6, st.hp);
  if (st.tag) g += `<rect x="${x - 17}" y="${y - r - 10}" width="34" height="15" rx="7.5" fill="${C.gold}" stroke="${C.ink}" stroke-width="1.5"/><text x="${x}" y="${y - r + 1.5}" font-size="10" text-anchor="middle" fill="${C.ink}">${st.tag}</text>`;
  return g;
}
function ultButton(x, y, r, p) {
  const a = p * 2 * Math.PI, ex = x + Math.sin(a) * r, ey = y - Math.cos(a) * r;
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="#3a2a55" stroke="#141626" stroke-width="2"/>
    <circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#4a4466" stroke-width="6"/>
    <path d="M${x},${y - r} A${r},${r} 0 ${p > 0.5 ? 1 : 0} 1 ${ex.toFixed(1)},${ey.toFixed(1)}" fill="none" stroke="${C.orange}" stroke-width="6" stroke-linecap="round"/>
    <path d="M${x - 12},${y - 14} L${x + 3},${y - 2}" stroke="#ffd34d" stroke-width="7" stroke-linecap="round" opacity=".7"/>
    <circle cx="${x + 4}" cy="${y - 1}" r="7" fill="${C.orange}" stroke="#c4501a" stroke-width="1.5"/>
    ${txt(x, y + r * 0.62, '大招', 13, '#fff', { sw: 3 })}`;
}
function finger(x, y) {
  return `<g transform="translate(${x} ${y}) rotate(-20)">
    <circle cx="0" cy="-2" r="14" fill="none" stroke="#fff" stroke-width="2.5" opacity=".9"/>
    <path d="M-5,0 L-5,-14 Q0,-20 5,-14 L5,4 L12,2 Q17,4 14,10 L6,26 L-10,26 L-14,8 Q-14,2 -8,4 Z" fill="#fff" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/></g>`;
}

// 通道背景（带透视）。返回 {svg, ex(t,y), sc(y)}
function lane(w, top, bottom, topW, botW, deco = true) {
  const cx = w / 2;
  const ex = (t, y) => { const k = (y - top) / (bottom - top); const hw = (topW + (botW - topW) * k) / 2; return cx - hw + t * 2 * hw; };
  const sc = (y) => 0.55 + 0.5 * (y - top) / (bottom - top);
  let g = `<rect x="0" y="${top}" width="${w}" height="${bottom - top}" fill="${C.grass}"/>`;
  for (let i = 0; i < 9; i++) g += `<rect x="0" y="${top + i * (bottom - top) / 9}" width="${w}" height="${(bottom - top) / 18}" fill="${C.grass2}" opacity=".35"/>`;
  g += `<path d="M${cx - topW / 2},${top} L${cx + topW / 2},${top} L${cx + botW / 2},${bottom} L${cx - botW / 2},${bottom} Z" fill="${C.road}"/>`;
  g += `<path d="M${cx - topW / 2},${top} L${cx - botW / 2},${bottom} M${cx + topW / 2},${top} L${cx + botW / 2},${bottom}" stroke="${C.roadEdge}" stroke-width="5"/>`;
  for (let i = 0; i < 7; i++) { const y = top + 20 + i * (bottom - top - 30) / 6; g += `<ellipse cx="${ex(0.5, y)}" cy="${y}" rx="${10 * sc(y)}" ry="${3 * sc(y)}" fill="${C.roadEdge}" opacity=".35"/>`; }
  if (deco) {
    const trees = [[0.06, 0.12], [0.93, 0.2], [0.04, 0.45], [0.95, 0.58], [0.07, 0.78], [0.92, 0.9]];
    for (const [tx, ty] of trees) {
      const y = top + ty * (bottom - top), x = tx * w, s = sc(y);
      g += `<ellipse cx="${x}" cy="${y + 16 * s}" rx="${16 * s}" ry="${5 * s}" fill="rgba(0,0,0,.15)"/>`;
      g += `<rect x="${x - 3 * s}" y="${y}" width="${6 * s}" height="${16 * s}" fill="#7a4a26"/>`;
      g += `<circle cx="${x}" cy="${y - 4 * s}" r="${15 * s}" fill="#3f9a4c" stroke="${C.ink}" stroke-width="1.5"/>`;
      g += `<circle cx="${x - 5 * s}" cy="${y - 9 * s}" r="${5 * s}" fill="#5fbf6a"/>`;
    }
  }
  return { svg: g, ex, sc };
}

// ---------- 图 1：主界面 ----------
(function main() {
  const W = 375, H = 667;
  let p = '';
  p += `<rect width="${W}" height="${H}" fill="${C.panel2}"/>`;
  const L = lane(W, 72, 492, 150, 320);
  p += L.svg;
  const { ex, sc } = L;

  // 敌人：法师刚上场，火球开始叠「燃烧」；前排几只身上是剑士留下、正在被引爆的「破甲」
  const foes = [
    [0.30, 96, C.purple], [0.55, 92, C.green], [0.78, 104, C.purple],
    [0.18, 136, C.green, 'fire', 1], [0.45, 130, C.purple], [0.72, 142, C.green, 'fire', 2],
    [0.30, 178, C.purple, 'fire', 1], [0.86, 186, C.purple],
    [0.15, 232, C.green], [0.40, 252, C.purple, 'fire', 2], [0.82, 262, C.green, 'fire', 1],
    [0.25, 304, C.purple], [0.70, 318, C.green],
  ];
  for (const [t, y, col, m, n] of foes) p += enemy(ex(t, y), y, sc(y), col, m, n);
  // 精英怪
  { const x = ex(0.55, 200), y = 200; p += enemy(x, y, sc(y) * 1.75, '#c9584c', 'fire', 3); p += hpBar(x, y - 46, 60, 0.55, '#ff5a4f'); p += txt(x, y - 52, '精英', 11, '#fff', { sw: 2.5 }); }

  // 引爆「破甲」的碎裂爆点（法师入场技触发）
  for (const [t, y, r] of [[0.25, 304, 20], [0.70, 318, 22], [0.15, 232, 16], [0.82, 262, 17]]) p += burst(ex(t, y), y - 4, r, '#fff6c8', '#ffb52e', 8);

  // 金币飞向顶栏
  for (const [x, y, r] of [[96, 220, 7], [100, 172, 6.5], [112, 128, 6], [130, 92, 5.5], [146, 64, 5]]) p += coin(x, y, r);

  // 火球
  p += fireball(232, 300, 1); p += fireball(214, 362, 0.9);

  // 剑士留下的退场效果「战旗」
  p += `<line x1="128" y1="476" x2="128" y2="430" stroke="#7a4a26" stroke-width="3"/><path d="M128,431 L150,438 L128,446 Z" fill="${C.red}" stroke="${C.ink}" stroke-width="1.5"/>`;
  p += txt(128, 488, '战旗 攻击+20%', 10, '#fff', { sw: 2.5 });

  // 英雄（法师，背身）
  p += heroBack('mage', 187, 440, 1);
  p += hpBar(187, 376, 46, 0.86);

  // 飘字
  p += txt(128, 196, '1,284', 15, '#fff', { sw: 3 });
  p += txt(262, 132, '2,066', 14, '#fff', { sw: 3 });
  p += txt(292, 236, '暴击 3,960', 17, '#ffe14d', { sw: 3.5 });
  p += `<g>${txt(186, 372 - 98, '碎甲 ×12', 31, C.orange, { sw: 6, rot: -5, strokeColor: '#3a1a10' })}${txt(190, 372 - 64, '15,360', 26, '#ffe14d', { sw: 5, rot: -5, strokeColor: '#3a1a10' })}</g>`;

  // 空投宝箱
  p += `<g transform="translate(46 122)"><path d="M-20,0 A20,16 0 0 1 20,0 Z" fill="#fff" stroke="${C.ink}" stroke-width="1.5"/>
    <path d="M-20,0 A20,16 0 0 1 -7,-14 L-7,0 Z M7,-14 A20,16 0 0 1 20,0 L7,0 Z" fill="${C.red}"/>
    <path d="M-20,0 L-6,20 M20,0 L6,20 M0,0 L0,20" stroke="${C.ink}" stroke-width="1"/>
    <rect x="-10" y="18" width="20" height="14" rx="2" fill="#b0702a" stroke="${C.ink}" stroke-width="1.5"/><rect x="-10" y="18" width="20" height="5" fill="#d08a3a" stroke="${C.ink}" stroke-width="1.2"/><rect x="-2" y="21" width="4" height="5" fill="${C.gold}"/></g>`;

  // 右上：自动 / 倍速
  p += `<rect x="314" y="80" width="52" height="22" rx="11" fill="rgba(20,22,40,.75)"/><circle cx="352" cy="91" r="7" fill="#5fd35f"/>${txt(331, 96, '自动', 12, '#fff', { stroke: false })}`;
  p += `<rect x="314" y="108" width="52" height="22" rx="11" fill="rgba(20,22,40,.75)"/>${txt(340, 124, '2倍速', 12, '#fff', { stroke: false })}`;

  // 顶栏
  p += `<rect width="${W}" height="50" fill="${C.panel}"/>`;
  p += `<rect x="10" y="12" width="104" height="26" rx="13" fill="#3e4366"/>${txt(62, 30, '第2章 · 第7关', 13, '#fff', { stroke: false })}`;
  p += coin(150, 25, 9) + txt(162, 30.5, '12.4万', 15, C.gold, { anchor: 'start', stroke: false });

  p += `<circle cx="352" cy="25" r="10" fill="none" stroke="#c8cbe0" stroke-width="3" stroke-dasharray="4 2.3"/><circle cx="352" cy="25" r="3.5" fill="#c8cbe0"/>`;

  p += `<rect x="252" y="464" width="40" height="34" rx="5" fill="#d08a3a" stroke="${C.ink}" stroke-width="2"/><rect x="252" y="464" width="40" height="11" fill="#e8a24a" stroke="${C.ink}" stroke-width="1.5"/><rect x="268" y="470" width="8" height="10" fill="${C.gold}" stroke="${C.ink}" stroke-width="1"/>`;
  p += txt(286, 462, '×3', 12, '#fff', { sw: 3 });
  p += `<rect x="300" y="468" width="62" height="28" rx="14" fill="${C.gold}" stroke="${C.ink}" stroke-width="2"/>${txt(331, 487, '开宝箱', 13, C.ink, { stroke: false })}`;
  [['攻击', 'Lv.24', '+4%', '860'], ['城墙', 'Lv.12', '+6%', '1.2万']].forEach(([n, lv, d, cost], i) => {
    const y = 512 + i * 42;
    p += `<rect x="10" y="${y}" width="${W - 20}" height="36" rx="10" fill="#fff" stroke="#e0d9cb" stroke-width="1.5"/>`;
    p += txt(26, y + 23, n, 14, C.ink, { anchor: 'start', stroke: false }) + txt(66, y + 23, lv, 12, '#8a8296', { anchor: 'start', stroke: false }) + txt(120, y + 23, d, 12, '#3f9a4c', { anchor: 'start', stroke: false });
    p += `<rect x="262" y="${y + 5}" width="98" height="26" rx="13" fill="${C.gold}" stroke="${C.ink}" stroke-width="1.5"/>`;
    p += coin(282, y + 18, 6) + txt(294, y + 23, cost, 13, C.ink, { anchor: 'start', stroke: false });
  });
  // 导航
  p += `<rect x="0" y="600" width="${W}" height="67" fill="${C.panel2}"/>`;
  ['战斗', '英雄', '符文', '宝箱', '更多'].forEach((n, i) => { const x = 37.5 + i * 75, col = i === 0 ? C.gold : '#9ea3c7'; p += `<circle cx="${x}" cy="626" r="9" fill="${col}" opacity="${i === 0 ? 1 : 0.7}"/>` + txt(x, 656, n, 12, col, { stroke: false }); });
  p += badge(150, 70, 1) + badge(54, 152, 2) + badge(296, 92, 3) + badge(16, 392, 4) + badge(236, 470, 5);

  // 高光全屏（右侧小手机）
  let q = `<rect width="${W}" height="${H}" fill="${C.panel2}"/>`;
  const Bz = hbattle(W, 0, H, 1.75, 9, { noWall: true, noHero: true });
  q += Bz.svg;
  q += `<g transform="translate(-30 0)">${heroSide('mage', 70, Bz.rows[1] - 4, 1.7)}</g>`;
  q += txt(190, 210, '连锁 ×48', 54, C.orange, { sw: 9, rot: -5, strokeColor: '#3a1a10' });
  q += txt(196, 270, '36,720', 40, '#ffe14d', { sw: 7, rot: -5, strokeColor: '#3a1a10' });
  for (const [x1, y1, x2, y2] of [[8, 60, 8, 150], [16, 90, 16, 170], [W - 8, 420, W - 8, 520], [W - 16, 450, W - 16, 540]]) q += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>`;
  q += `<rect x="14" y="16" width="120" height="30" rx="15" fill="rgba(20,22,40,.7)"/><circle cx="34" cy="31" r="7" fill="#ff4d4d"/>${txt(84, 37, '高光录制中', 14, '#fff', { stroke: false })}`;
  q += badge(350, 31, 6);

  const svg = document.getElementById('horizontal');
  let s = `<rect width="1100" height="720" fill="#f4f1ea"/>`;
  s += `<rect x="22" y="18" width="391" height="683" rx="40" fill="#15161f"/>`;
  s += `<clipPath id="scrH"><rect x="30" y="26" width="${W}" height="${H}" rx="32"/></clipPath>`;
  s += `<g clip-path="url(#scrH)"><g transform="translate(30 26)">${p}</g></g>`;
  const k2 = 0.6, px = 448, py = 104;
  s += `<rect x="${px - 5}" y="${py - 5}" width="${W * k2 + 10}" height="${H * k2 + 10}" rx="24" fill="#15161f"/>`;
  s += `<clipPath id="scrH2"><rect x="${px}" y="${py}" width="${W * k2}" height="${H * k2}" rx="19"/></clipPath>`;
  s += `<g clip-path="url(#scrH2)"><g transform="translate(${px} ${py}) scale(${k2})">${q}</g></g>`;
  s += `<text x="${px + W * k2 / 2}" y="${py + H * k2 + 34}" font-size="16" fill="${C.ink}" text-anchor="middle">连锁够长时：高光全屏 1.5 秒</text>`;
  s += `<text x="${px + W * k2 / 2}" y="${py + H * k2 + 56}" font-size="13" fill="#5d5770" text-anchor="middle">镜头拉近、界面收起、自动录屏</text>`;
  s += `<path d="M${px - 26},${py + 150} l18,0 m-7,-7 l7,7 l-7,7" stroke="#b9b2c8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  s += `<text x="448" y="52" font-size="24" fill="${C.ink}">竖屏 + 横版战斗（示意）</text>`;
  s += `<text x="448" y="78" font-size="13" fill="#7a7488">左：平时的主界面；右：连锁够长时的高光时刻</text>`;
  const notes = [
    ['战斗区（上半屏约 48%）', '英雄在左边守城，怪从右边来；|三排有纵深，同屏 15～25 只'],
    ['城墙', '怪打到墙边扣城墙血，|墙倒了才算这一关失败'],
    ['连锁', '像导火索一样从左往右一路烧过去'],
    ['英雄栏', '点头像换人，右边是大招'],
    ['成长区（下半屏）', '符文、强化、宝箱都在这里，|一边看战斗一边升级'],
    ['高光全屏', '连锁够长时镜头拉近、界面收起，|同时自动录屏；投放视频就从这里录'],
  ];
  notes.forEach(([t, d], i) => {
    const y = 132 + i * 92, x = 700;
    s += badge(x + 12, y, i + 1);
    s += `<text x="${x + 32}" y="${y + 5}" font-size="16" fill="${C.ink}">${t}</text>`;
    d.split('|').forEach((ln, j) => { s += `<text x="${x + 32}" y="${y + 28 + j * 19}" font-size="13" fill="#5d5770">${ln}</text>`; });
  });
  svg.innerHTML = s;
})();
</script>
